[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["__pycache__", ".venv", "venv", "alembic/versions", "app/main_1.py", "app/main_2.py", "app/api/routes/*_1.py", "app/api/routes/*_2.py", "app/api/routes/*_3.py", "app/services/email_service_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "BLE001",
    "E501",
    "W191",
    "E712",  # comparison with True
    "E711",  # comparison with None
]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/__init__.py" = ["F401"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
