version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: attendance_postgres
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_POSTGRES: "True"
      DATABASE_URL: postgresql://attendance:attendance@postgres:5432/attendance_db
      DATABASE_URL_DEV: postgresql://attendance:attendance@postgres:5432/attendance_db
    volumes:
      - ./app:/app/app
    restart: unless-stopped

volumes:
  postgres_data:
